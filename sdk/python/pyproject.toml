[build-system]
requires = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "aeon-sdk"
version = "0.1.0"
description = "Python SDK for the AEON OS API"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [{ name = "AEON OS Contributors" }]
keywords = ["aeon", "aeon-os", "ai", "agent", "sdk"]
classifiers = [
  "Development Status :: 3 - Alpha",
  "Intended Audience :: Developers",
  "License :: OSI Approved :: MIT License",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.10",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
]
dependencies = [
  "requests>=2.28.0",
]

[project.urls]
Homepage = "https://github.com/beatznlg/aeon"
Repository = "https://github.com/beatznlg/aeon"

[tool.setuptools]
py-modules = ["aeon_sdk"]
