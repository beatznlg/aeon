<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="630" viewBox="0 0 1200 630">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0a0a1a"/>
      <stop offset="50%" stop-color="#0f0f2e"/>
      <stop offset="100%" stop-color="#1a0a2e"/>
    </linearGradient>
    <linearGradient id="accent" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#7c3aed"/>
      <stop offset="100%" stop-color="#6366f1"/>
    </linearGradient>
    <linearGradient id="glow1" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#7c3aed" stop-opacity="0.15"/>
      <stop offset="100%" stop-color="#7c3aed" stop-opacity="0"/>
    </linearGradient>
    <linearGradient id="glow2" x1="100%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#06b6d4" stop-opacity="0.08"/>
      <stop offset="100%" stop-color="#06b6d4" stop-opacity="0"/>
    </linearGradient>
  </defs>

  <!-- Background -->
  <rect width="1200" height="630" fill="url(#bg)"/>

  <!-- Ambient glow effects -->
  <ellipse cx="200" cy="150" rx="400" ry="300" fill="url(#glow1)"/>
  <ellipse cx="1000" cy="500" rx="350" ry="250" fill="url(#glow2)"/>

  <!-- Grid pattern overlay (subtle) -->
  <g opacity="0.03" stroke="#ffffff" stroke-width="0.5">
    <line x1="0" y1="0" x2="0" y2="630"/>
    <line x1="100" y1="0" x2="100" y2="630"/>
    <line x1="200" y1="0" x2="200" y2="630"/>
    <line x1="300" y1="0" x2="300" y2="630"/>
    <line x1="400" y1="0" x2="400" y2="630"/>
    <line x1="500" y1="0" x2="500" y2="630"/>
    <line x1="600" y1="0" x2="600" y2="630"/>
    <line x1="700" y1="0" x2="700" y2="630"/>
    <line x1="800" y1="0" x2="800" y2="630"/>
    <line x1="900" y1="0" x2="900" y2="630"/>
    <line x1="1000" y1="0" x2="1000" y2="630"/>
    <line x1="1100" y1="0" x2="1100" y2="630"/>
    <line x1="1200" y1="0" x2="1200" y2="630"/>
    <line x1="0" y1="0" x2="1200" y2="0"/>
    <line x1="0" y1="106" x2="1200" y2="106"/>
    <line x1="0" y1="212" x2="1200" y2="212"/>
    <line x1="0" y1="318" x2="1200" y2="318"/>
    <line x1="0" y1="424" x2="1200" y2="424"/>
    <line x1="0" y1="530" x2="1200" y2="530"/>
  </g>

  <!-- Brand mark -->
  <g transform="translate(60, 50)">
    <polygon points="16,0 32,9.2 32,27.7 16,37 0,27.7 0,9.2" fill="none" stroke="url(#accent)" stroke-width="1.5" opacity="0.8"/>
    <text x="44" y="24" font-family="system-ui, -apple-system, sans-serif" font-size="22" font-weight="700" fill="#ffffff" letter-spacing="0.05em">AEON OS</text>
  </g>

  <!-- Main title -->
  <text x="60" y="140" font-family="system-ui, -apple-system, sans-serif" font-size="52" font-weight="800" fill="#ffffff" letter-spacing="-0.02em">
    Simple, transparent
  </text>
  <text x="60" y="200" font-family="system-ui, -apple-system, sans-serif" font-size="52" font-weight="800" fill="url(#accent)" letter-spacing="-0.02em">
    pricing
  </text>

  <!-- Subtitle -->
  <text x="60" y="250" font-family="system-ui, -apple-system, sans-serif" font-size="18" fill="#94a3b8" letter-spacing="0.01em">
    Enterprise AI governance at every tier. Start free, scale with your team.
  </text>

  <!-- Plan cards -->
  <!-- Free Plan -->
  <g transform="translate(60, 310)">
    <rect width="320" height="180" rx="12" fill="#ffffff" fill-opacity="0.03" stroke="#ffffff" stroke-opacity="0.08" stroke-width="1"/>
    <text x="24" y="36" font-family="system-ui, -apple-system, sans-serif" font-size="14" font-weight="600" fill="#94a3b8" letter-spacing="0.08em" text-transform="uppercase">FREE</text>
    <text x="24" y="78" font-family="system-ui, -apple-system, sans-serif" font-size="40" font-weight="800" fill="#ffffff">$0</text>
    <text x="110" y="78" font-family="system-ui, -apple-system, sans-serif" font-size="14" fill="#64748b">/forever</text>
    <text x="24" y="110" font-family="system-ui, -apple-system, sans-serif" font-size="13" fill="#64748b">1 workspace · Basic sectors</text>
    <text x="24" y="135" font-family="system-ui, -apple-system, sans-serif" font-size="13" fill="#64748b">Community plugins</text>
    <text x="24" y="160" font-family="system-ui, -apple-system, sans-serif" font-size="13" fill="#64748b">Stub AI provider</text>
  </g>

  <!-- Team Plan (highlighted) -->
  <g transform="translate(440, 310)">
    <rect width="320" height="180" rx="12" fill="#7c3aed" fill-opacity="0.08" stroke="#7c3aed" stroke-opacity="0.3" stroke-width="1.5"/>
    <rect x="0" y="0" width="320" height="2" rx="1" fill="url(#accent)"/>
    <!-- Most Popular badge -->
    <rect x="24" y="20" width="100" height="22" rx="11" fill="#7c3aed"/>
    <text x="74" y="36" font-family="system-ui, -apple-system, sans-serif" font-size="11" font-weight="700" fill="#ffffff" text-anchor="middle" letter-spacing="0.04em">MOST POPULAR</text>
    <text x="24" y="80" font-family="system-ui, -apple-system, sans-serif" font-size="40" font-weight="800" fill="#ffffff">$49</text>
    <text x="116" y="80" font-family="system-ui, -apple-system, sans-serif" font-size="14" fill="#a78bfa">/month</text>
    <text x="24" y="112" font-family="system-ui, -apple-system, sans-serif" font-size="13" fill="#c4b5fd">Up to 10 workspaces · All 16 sectors</text>
    <text x="24" y="137" font-family="system-ui, -apple-system, sans-serif" font-size="13" fill="#c4b5fd">All AI providers · RAG · Automations</text>
    <text x="24" y="162" font-family="system-ui, -apple-system, sans-serif" font-size="13" fill="#c4b5fd">14-day free trial included</text>
  </g>

  <!-- Enterprise Plan -->
  <g transform="translate(820, 310)">
    <rect width="320" height="180" rx="12" fill="#ffffff" fill-opacity="0.03" stroke="#ffffff" stroke-opacity="0.08" stroke-width="1"/>
    <text x="24" y="36" font-family="system-ui, -apple-system, sans-serif" font-size="14" font-weight="600" fill="#94a3b8" letter-spacing="0.08em">ENTERPRISE</text>
    <text x="24" y="78" font-family="system-ui, -apple-system, sans-serif" font-size="40" font-weight="800" fill="#ffffff">$199</text>
    <text x="130" y="78" font-family="system-ui, -apple-system, sans-serif" font-size="14" fill="#64748b">/month</text>
    <text x="24" y="110" font-family="system-ui, -apple-system, sans-serif" font-size="13" fill="#64748b">Unlimited workspaces · SSO/SCIM</text>
    <text x="24" y="135" font-family="system-ui, -apple-system, sans-serif" font-size="13" fill="#64748b">SIEM · Disaster recovery · Compliance</text>
    <text x="24" y="160" font-family="system-ui, -apple-system, sans-serif" font-size="13" fill="#64748b">Dedicated support &amp; SLA</text>
  </g>

  <!-- Bottom accent line -->
  <rect x="0" y="626" width="1200" height="4" fill="url(#accent)" opacity="0.6"/>

  <!-- Corner decorations -->
  <circle cx="1140" cy="60" r="3" fill="#7c3aed" opacity="0.5"/>
  <circle cx="1155" cy="60" r="3" fill="#6366f1" opacity="0.3"/>
  <circle cx="1170" cy="60" r="3" fill="#06b6d4" opacity="0.2"/>
</svg>
