# Example Ingress for AEON.
# Adjust annotations for your cluster's ingress controller (nginx, traefik, etc.).
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: aeon-server
  namespace: aeon
  annotations:
    nginx.ingress.kubernetes.io/rewrite-target: /
    # cert-manager.io/cluster-issuer: "letsencrypt-prod"
spec:
  ingressClassName: nginx
  # tls:
  #   - hosts:
  #       - aeon.example.com
  #     secretName: aeon-tls
  rules:
    - host: aeon.example.com
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: aeon-server
                port:
                  number: 80
