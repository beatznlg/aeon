name: Deploy Backend to Railway

on:
  push:
    branches: [main]
    paths:
      - 'Dockerfile'
      - 'aeon*.py'
      - 'requirements.txt'
      - 'scripts/**'
      - 'railway.backend.json'
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment: production
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Railway CLI
        run: npm install -g @railway/cli

      - name: Deploy to Railway
        run: railway up --service=aeon-backend
        env:
          RAILWAY_TOKEN: ${{ secrets.RAILWAY_TOKEN }}

      - name: Verify health
        run: |
          BACKEND_URL="${{ vars.AEON_BACKEND_URL }}"
          if [ -z "$BACKEND_URL" ]; then
            echo "AEON_BACKEND_URL not set — skipping health check"
            exit 0
          fi
          for i in {1..5}; do
            sleep 15
            STATUS=$(curl -s -o /dev/null -w "%{http_code}" "${BACKEND_URL}/health" || true)
            if [ "$STATUS" = "200" ]; then
              echo "✅ Backend healthy at ${BACKEND_URL}"
              exit 0
            fi
            echo "Health check attempt $i: HTTP $STATUS"
          done
          echo " Backend health check failed"
          exit 1
