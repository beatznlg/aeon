name: Python Quality Gate

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

jobs:
  python-qa:
    name: Lint + Unit Tests
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt --quiet
          pip install -r requirements-dev.txt --quiet

      - name: Compile-check core Python modules
        run: |
          python -m py_compile aeon.py aeon_server.py aeon_auth.py aeon_db.py
          echo "✅ Core Python modules compile"

      - name: Lint tests and Python SDK with ruff
        run: ruff check tests/ sdk/python/

      - name: Check formatting with ruff
        run: ruff format --check tests/ sdk/python/

      - name: Run pytest
        run: pytest -v

      # Optional backend lint: surfaces legacy debt without blocking the gate.
      - name: Lint backend modules (informational)
        run: ruff check aeon*.py
        continue-on-error: true
