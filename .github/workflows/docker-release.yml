# AEON OS — Docker Release
# =========================
# Builds, signs, and publishes Docker images to GitHub Container Registry (GHCR)
# when a version tag is pushed (e.g. v1.0.0).
#
# Images published:
#   ghcr.io/<owner>/aeon-backend:latest
#   ghcr.io/<owner>/aeon-backend:v1.0.0
#   ghcr.io/<owner>/aeon-frontend:latest
#   ghcr.io/<owner>/aeon-frontend:v1.0.0
#
# Usage:
#   git tag v1.0.0 && git push origin v1.0.0

name: Docker Release

on:
  push:
    tags:
      - "v*.*.*"

env:
  REGISTRY: ghcr.io
  IMAGE_BACKEND: aeon-backend
  IMAGE_FRONTEND: aeon-frontend

jobs:
  release:
    name: Build & Publish
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
      packages: write
      id-token: write  # for cosign

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      # ── Extract version from tag ──────────────────────────────────────
      - name: Extract version
        id: meta
        run: |
          TAG=${GITHUB_REF#refs/tags/}
          echo "version=$TAG" >> "$GITHUB_OUTPUT"
          echo "version_raw=${TAG#v}" >> "$GITHUB_OUTPUT"

      # ── Log in to GHCR ────────────────────────────────────────────────
      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # ── Set up Docker Buildx with QEMU for multi-arch ────────────────
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v4

      # ── Build tags ────────────────────────────────────────────────────
      - name: Docker metadata (backend)
        id: meta-backend
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ github.repository }}/${{ env.IMAGE_BACKEND }}
          tags: |
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=raw,value=latest,enable={{is_default_branch}}
          flavor: |
            latest=false

      - name: Docker metadata (frontend)
        id: meta-frontend
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ github.repository }}/${{ env.IMAGE_FRONTEND }}
          tags: |
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=raw,value=latest,enable={{is_default_branch}}
          flavor: |
            latest=false

      # ── Build & push backend ──────────────────────────────────────────
      - name: Build & push backend
        id: build-backend
        uses: docker/build-push-action@v6
        with:
          context: .
          file: Dockerfile
          push: true
          platforms: linux/amd64,linux/arm64
          tags: ${{ steps.meta-backend.outputs.tags }}
          labels: ${{ steps.meta-backend.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
          provenance: true
          sbom: true

      # ── Build & push frontend ─────────────────────────────────────────
      - name: Build & push frontend
        id: build-frontend
        uses: docker/build-push-action@v6
        with:
          context: web
          file: web/Dockerfile
          push: true
          platforms: linux/amd64,linux/arm64
          tags: ${{ steps.meta-frontend.outputs.tags }}
          labels: ${{ steps.meta-frontend.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
          provenance: true
          sbom: true

      # ── Sign images with cosign ───────────────────────────────────────
      - name: Install cosign
        uses: sigstore/cosign-installer@v3

      - name: Sign backend images
        run: |
          cosign sign --yes \
            ${{ env.REGISTRY }}/${{ github.repository }}/${{ env.IMAGE_BACKEND }}@${{ steps.build-backend.outputs.digest }}

      - name: Sign frontend images
        run: |
          cosign sign --yes \
            ${{ env.REGISTRY }}/${{ github.repository }}/${{ env.IMAGE_FRONTEND }}@${{ steps.build-frontend.outputs.digest }}

      # ── Create GitHub Release ─────────────────────────────────────────
      - name: Create Release
        uses: softprops/action-gh-release@v2
        if: startsWith(github.ref, 'refs/tags/')
        with:
          name: AEON OS ${{ steps.meta.outputs.version }}
          generate_release_notes: true
          make_latest: true
