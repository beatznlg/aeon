# AEON OS — Google Artifact Registry Release
# Builds versioned frontend/backend images and publishes them to Google Artifact Registry.
# Authentication uses GitHub OIDC / Workload Identity Federation; no long-lived GCP key is stored in GitHub.

name: Google Cloud Release

on:
  push:
    tags:
      - "v*.*.*"

permissions:
  contents: read
  id-token: write

env:
  IMAGE_BACKEND: aeon-backend
  IMAGE_FRONTEND: aeon-frontend

jobs:
  release:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Authenticate to Google Cloud
        uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: ${{ secrets.GCP_WIF_PROVIDER }}
          service_account: ${{ secrets.GCP_RELEASE_SERVICE_ACCOUNT }}

      - name: Set up gcloud
        uses: google-github-actions/setup-gcloud@v2

      - name: Configure Docker for Artifact Registry
        run: gcloud auth configure-docker "${{ vars.GCP_ARTIFACT_REGION }}-docker.pkg.dev" --quiet

      - name: Set release metadata
        id: meta
        shell: bash
        run: |
          TAG="${GITHUB_REF#refs/tags/}"
          VERSION="${TAG#v}"
          echo "tag=$TAG" >> "$GITHUB_OUTPUT"
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"

      - name: Build and push backend
        env:
          REGISTRY: ${{ vars.GCP_ARTIFACT_REGION }}-docker.pkg.dev/${{ vars.GCP_PROJECT_ID }}/${{ vars.GCP_ARTIFACT_REPOSITORY }}
          VERSION: ${{ steps.meta.outputs.version }}
        run: |
          docker build -t "$REGISTRY/aeon-backend:$VERSION" -t "$REGISTRY/aeon-backend:latest" .
          docker push "$REGISTRY/aeon-backend:$VERSION"
          docker push "$REGISTRY/aeon-backend:latest"

      - name: Build and push frontend
        env:
          REGISTRY: ${{ vars.GCP_ARTIFACT_REGION }}-docker.pkg.dev/${{ vars.GCP_PROJECT_ID }}/${{ vars.GCP_ARTIFACT_REPOSITORY }}
          VERSION: ${{ steps.meta.outputs.version }}
        run: |
          docker build -t "$REGISTRY/aeon-frontend:$VERSION" -t "$REGISTRY/aeon-frontend:latest" -f web/Dockerfile web
          docker push "$REGISTRY/aeon-frontend:$VERSION"
          docker push "$REGISTRY/aeon-frontend:latest"

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          name: AEON OS ${{ steps.meta.outputs.tag }}
          generate_release_notes: true
          make_latest: true
