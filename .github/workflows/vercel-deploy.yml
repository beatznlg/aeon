# AEON OS — Vercel Frontend Deploy
# ==================================
# Automatically deploys the Next.js frontend to Vercel:
#   - Push to main   → Production deploy (--prod)
#   - Pull request   → Preview deploy (unique URL in PR comment)
#
# Before deploying, runs:
#   - Next.js lint (eslint)
#   - TypeScript typecheck (tsc --noEmit)
#   - Production build (npm run build)
#
# Prerequisites — set these GitHub Actions secrets:
#   VERCEL_TOKEN       Vercel API token (from Account → Settings → Tokens)
#   VERCEL_ORG_ID      Vercel Team ID (from Project Settings → General)
#   VERCEL_PROJECT_ID  Vercel Project ID (from Project Settings → General)
#
# The Vercel project must be configured to use "web/" as the Root Directory
# in Project Settings → General → Root Directory.

name: Vercel Deploy

on:
  push:
    branches: [main]
    paths:
      - "web/**"
      - "vercel.json"
      - ".github/workflows/vercel-deploy.yml"
  pull_request:
    branches: [main]
    paths:
      - "web/**"
      - "vercel.json"
      - ".github/workflows/vercel-deploy.yml"

# Default workflow token is read-only; the preview comment job opts into PR writes.
permissions:
  contents: read

env:
  VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
  VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}

jobs:
  # ─── Pre-deploy checks: lint + typecheck + build ──────────────────────
  check:
    name: Lint, Typecheck & Build
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: web

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node 20
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"
          cache-dependency-path: web/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Next.js lint
        run: npm run lint

      - name: TypeScript typecheck
        run: npx tsc --noEmit

      - name: Production build
        run: npm run build

      - name: Check build output exists
        run: |
          if [ -d ".next" ]; then
            echo "✅ .next directory created — build succeeded"
            du -sh .next
          else
            echo "❌ .next directory missing — build may have failed"
            exit 1
          fi

  # ─── Production Deploy (push to main) ──────────────────────────────────
  deploy-production:
    name: Deploy to Production
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: [check]
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node 20
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"
          cache-dependency-path: web/package-lock.json

      - name: Install Vercel CLI
        run: npm install --global vercel@latest

      - name: Pull Vercel environment
        run: |
          vercel pull \
            --yes \
            --environment=production \
            --token=${{ secrets.VERCEL_TOKEN }} \
            --cwd=web

      - name: Build project artifacts for Vercel
        run: |
          vercel build \
            --prod \
            --token=${{ secrets.VERCEL_TOKEN }} \
            --cwd=web

      - name: Deploy to Vercel
        id: deploy
        run: |
          vercel deploy \
            --prebuilt \
            --prod \
            --token=${{ secrets.VERCEL_TOKEN }} \
            --cwd=web \
            > deploy-url.txt
          echo "url=$(cat deploy-url.txt)" >> "$GITHUB_OUTPUT"

      - name: Log deployment URL
        run: echo "✅ Production deploy complete → ${{ steps.deploy.outputs.url }}"

  # ─── Preview Deploy (pull request) ─────────────────────────────────────
  deploy-preview:
    name: Deploy Preview
    if: github.event_name == 'pull_request'
    needs: [check]
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: write
    timeout-minutes: 15

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node 20
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"
          cache-dependency-path: web/package-lock.json

      - name: Install Vercel CLI
        run: npm install --global vercel@latest

      - name: Pull Vercel environment
        env:
          GIT_HEAD_REF: ${{ github.head_ref }}
        run: |
          vercel pull \
            --yes \
            --environment=preview \
            --git-branch="$GIT_HEAD_REF" \
            --token=${{ secrets.VERCEL_TOKEN }} \
            --cwd=web

      - name: Build project artifacts for Vercel
        run: |
          vercel build \
            --token=${{ secrets.VERCEL_TOKEN }} \
            --cwd=web

      - name: Deploy to Vercel (preview)
        id: deploy
        run: |
          vercel deploy \
            --prebuilt \
            --token=${{ secrets.VERCEL_TOKEN }} \
            --cwd=web \
            > deploy-url.txt
          echo "url=$(cat deploy-url.txt)" >> "$GITHUB_OUTPUT"

      - name: Comment preview URL on PR
        uses: actions/github-script@v7
        with:
          script: |
            const url = '${{ steps.deploy.outputs.url }}';
            const sha = '${{ github.sha }}'.slice(0, 7);
            github.rest.issues.createComment({
              issue_number: context.issue.number,
              owner: context.repo.owner,
              repo: context.repo.repo,
              body: `🚀 **Preview deploy ready** — [${url}](${url})\n\n` +
                    `Commit: \`${sha}\`\n` +
                    `Environment: Preview`
            });
