# Google Cloud Build pipeline for AEON OS.
#
# Wire-up (one time, from Cloud Shell in your GCP project):
#   sh scripts/setup-gcp-cicd.sh
# It enables APIs, grants roles, fixes the push trigger (no manual approval,
# correct service account), and verifies the deployment. After it succeeds
# once, every push to main builds, tests, and deploys both services
# automatically — including the dashboard admin bootstrap and the aeon-web
# environment wiring.
#
# Manual one-off run: COMMIT_SHA is only auto-set for trigger builds, so pass
# it explicitly when submitting by hand:
#   gcloud builds submit --config cloudbuild.yaml \
#     --substitutions COMMIT_SHA=$(git rev-parse HEAD) .
#
# ── '$' ESCAPING RULE (read before editing the step scripts) ────────────────
# Cloud Build performs substitution on EVERY string in this file, including
# the bash scripts embedded in `args`. Therefore:
#   • Genuine build substitutions stay unescaped: $PROJECT_ID, $COMMIT_SHA,
#     ${_REGION}, ${_REPOSITORY}, ${_BACKEND_SERVICE}, ${_FRONTEND_SERVICE},
#     ${_ADMIN_EMAIL}.
#   • Every literal '$' that bash must see at runtime is written as '$$' —
#     Cloud Build unescapes '$$' to '$' after substitution. A bare '$URL' or
#     '$i' would fail validation with:
#       invalid value for 'build.substitutions': key in the template "URL"
#       is not a valid built-in substitution
#
# ── NO CURL, NO HEREDOCS ───────────────────────────────────────────────────
# • cloudsdktool/cloud-sdk:slim ships no curl binary — any curl-based gate
#   fails with non-zero status even after a successful deploy. HTTP checks
#   below use python3 (which the image includes).
# • Bash heredocs cannot be embedded in YAML block scalars (their column-0
#   content terminates the scalar and corrupts the file). Multi-line python
#   is passed via `python3 -c "..."` with values handed over through
#   environment variables instead of string interpolation.
#
# The deploy steps do NOT touch Cloud SQL instances or service accounts —
# they roll out new image revisions and merge environment variables
# (--update-env-vars never removes existing keys).

substitutions:
  _REGION: europe-west1
  _REPOSITORY: aeon
  _BACKEND_SERVICE: aeon-api
  _FRONTEND_SERVICE: aeon-web
  # Email for the auto-created dashboard admin on first deploy. The password
  # is generated randomly and printed ONCE in the first build log.
  _ADMIN_EMAIL: beatznlg@gmail.com

steps:
  # ── Quality gates ─────────────────────────────────────────────────────
  - id: test-backend
    name: python:3.12-slim
    entrypoint: bash
    args:
      - -ceu
      - |
        python -m pip install --upgrade pip
        if [ -f requirements.txt ]; then pip install -r requirements.txt; fi
        # pytest lives in requirements-dev.txt, not requirements.txt — without
        # this the quality gate below fails on its very first run.
        if [ -f requirements-dev.txt ]; then pip install -r requirements-dev.txt; fi
        if [ -d tests ]; then python -m pytest -q; fi

  - id: build-backend
    name: gcr.io/cloud-builders/docker
    args:
      - build
      - -t
      - ${_REGION}-docker.pkg.dev/$PROJECT_ID/${_REPOSITORY}/aeon-backend:$COMMIT_SHA
      - .

  - id: build-frontend
    name: gcr.io/cloud-builders/docker
    args:
      - build
      - -t
      - ${_REGION}-docker.pkg.dev/$PROJECT_ID/${_REPOSITORY}/aeon-frontend:$COMMIT_SHA
      # Prerender ~60 routes on 4 of the 8 builder CPUs (Dockerfile default is 1).
      - --build-arg
      - AEON_BUILD_CPUS=4
      - -f
      - web/Dockerfile
      - web

  - id: push-backend
    name: gcr.io/cloud-builders/docker
    args:
      - push
      - ${_REGION}-docker.pkg.dev/$PROJECT_ID/${_REPOSITORY}/aeon-backend:$COMMIT_SHA

  - id: push-frontend
    name: gcr.io/cloud-builders/docker
    args:
      - push
      - ${_REGION}-docker.pkg.dev/$PROJECT_ID/${_REPOSITORY}/aeon-frontend:$COMMIT_SHA

  # ── Deploy (Cloud Run) ────────────────────────────────────────────────
  # Only the image changes; existing env vars, Cloud SQL connections, and
  # service accounts on the services are preserved. `gcloud run services
  # wait` blocks until the new revision is Ready (startup probes passed).
  - id: deploy-backend
    name: gcr.io/google.com/cloudsdktool/cloud-sdk:slim
    entrypoint: bash
    args:
      - -ceu
      - |
        gcloud run deploy ${_BACKEND_SERVICE} \
          --image ${_REGION}-docker.pkg.dev/$PROJECT_ID/${_REPOSITORY}/aeon-backend:$COMMIT_SHA \
          --region ${_REGION} \
          --allow-unauthenticated \
          --quiet
        echo "Waiting for the new backend revision to become Ready..."
        gcloud run services wait ${_BACKEND_SERVICE} --region ${_REGION} --quiet
        URL=$$(gcloud run services describe ${_BACKEND_SERVICE} --region ${_REGION} --format='value(status.url)')
        for i in $$(seq 1 30); do
          if python3 -c "import urllib.request as u,sys; sys.exit(0 if u.urlopen('$${URL}/health',timeout=10).status==200 else 1)" 2>/dev/null; then
            echo "Backend healthy after $$i attempt(s)."
            exit 0
          fi
          sleep 5
        done
        echo "::error::Backend health gate failed after 150s." >&2
        exit 1

  - id: deploy-frontend
    name: gcr.io/google.com/cloudsdktool/cloud-sdk:slim
    entrypoint: bash
    args:
      - -ceu
      - |
        # --allow-unauthenticated is critical on FIRST deploy: a newly created
        # service otherwise defaults to authenticated-only (403 for everyone,
        # including the health gate below and every dashboard user).
        gcloud run deploy ${_FRONTEND_SERVICE} \
          --image ${_REGION}-docker.pkg.dev/$PROJECT_ID/${_REPOSITORY}/aeon-frontend:$COMMIT_SHA \
          --region ${_REGION} \
          --allow-unauthenticated \
          --quiet
        echo "Waiting for the new frontend revision to become Ready..."
        gcloud run services wait ${_FRONTEND_SERVICE} --region ${_REGION} --quiet
        URL=$$(gcloud run services describe ${_FRONTEND_SERVICE} --region ${_REGION} --format='value(status.url)')
        for i in $$(seq 1 30); do
          if python3 -c "import urllib.request as u,sys; sys.exit(0 if u.urlopen('$${URL}/api/health',timeout=10).status==200 else 1)" 2>/dev/null; then
            echo "Frontend responding after $$i attempt(s)."
            exit 0
          fi
          sleep 5
        done
        echo "::error::Frontend health gate failed after 150s." >&2
        exit 1

  - id: wire-frontend-env
    # Point the dashboard at the backend and give Auth.js its settings.
    # --update-env-vars merges; unrelated existing env vars are preserved.
    # AUTH_SECRET is generated only if none is set, so redeploys never rotate
    # it (rotating would sign out every existing session).
    name: gcr.io/google.com/cloudsdktool/cloud-sdk:slim
    entrypoint: bash
    args:
      - -ceu
      - |
        API_URL=$$(gcloud run services describe ${_BACKEND_SERVICE} --region ${_REGION} --format='value(status.url)')
        WEB_URL=$$(gcloud run services describe ${_FRONTEND_SERVICE} --region ${_REGION} --format='value(status.url)')
        CURRENT=$$(gcloud run services describe ${_FRONTEND_SERVICE} --region ${_REGION} \
          --format='value(spec.template.spec.containers[0].env)')
        ENV_UPDATE="AEON_PYTHON_URL=$${API_URL},NEXTAUTH_URL=$${WEB_URL},AUTH_TRUST_HOST=true"
        case "$$CURRENT" in
          *AUTH_SECRET*)
            echo "AUTH_SECRET already set — left untouched." ;;
          *)
            AUTH_SECRET=$$(python3 -c 'import secrets; print(secrets.token_hex(32))')
            ENV_UPDATE="$$ENV_UPDATE,AUTH_SECRET=$$AUTH_SECRET"
            echo "Generated a new AUTH_SECRET (none was set)." ;;
        esac
        gcloud run services update ${_FRONTEND_SERVICE} --region ${_REGION} \
          --update-env-vars "$$ENV_UPDATE" --quiet
        echo "aeon-web env wired: AEON_PYTHON_URL, NEXTAUTH_URL, AUTH_TRUST_HOST (+ AUTH_SECRET if new)"

  - id: seed-admin
    # Zero-touch dashboard admin bootstrap on the FIRST deploy. Skipped once
    # AEON_ADMIN_EMAIL exists on the service, so later deploys never rotate a
    # password the owner already knows. Re-seed manually any time with
    # scripts/seed-admin-gcp.sh from Cloud Shell.
    name: gcr.io/google.com/cloudsdktool/cloud-sdk:slim
    entrypoint: bash
    args:
      - -ceu
      - |
        if gcloud run services describe ${_BACKEND_SERVICE} --region ${_REGION} \
            --format='value(spec.template.spec.containers[0].env)' 2>/dev/null \
            | grep -q 'AEON_ADMIN_EMAIL'; then
          echo "AEON_ADMIN_EMAIL already configured — skipping admin bootstrap."
          exit 0
        fi
        ADMIN_EMAIL='${_ADMIN_EMAIL}'
        ADMIN_PASSWORD=$$(python3 -c 'import secrets; print(secrets.token_hex(16))')
        echo "Bootstrapping dashboard admin: $${ADMIN_EMAIL}"
        gcloud run services update ${_BACKEND_SERVICE} --region ${_REGION} \
          --update-env-vars "AEON_ADMIN_EMAIL=$${ADMIN_EMAIL},AEON_ADMIN_PASSWORD=$${ADMIN_PASSWORD},AEON_ADMIN_RESET_PASSWORD=true" \
          --quiet
        gcloud run services wait ${_BACKEND_SERVICE} --region ${_REGION} --quiet || true
        gcloud run services update ${_BACKEND_SERVICE} --region ${_REGION} \
          --remove-env-vars AEON_ADMIN_RESET_PASSWORD --quiet
        gcloud run services wait ${_BACKEND_SERVICE} --region ${_REGION} --quiet || true
        URL=$$(gcloud run services describe ${_BACKEND_SERVICE} --region ${_REGION} --format='value(status.url)')
        export AEON_URL="$$URL" AEON_EM="$${ADMIN_EMAIL}" AEON_PW="$${ADMIN_PASSWORD}"
        LOGIN_CODE=$$(python3 -c "import json,os,time,urllib.request as u,urllib.error as e
        code = 0
        for attempt in range(24):
            try:
                req = u.Request(os.environ['AEON_URL'].rstrip('/') + '/auth/login',
                                data=json.dumps({'email': os.environ['AEON_EM'], 'password': os.environ['AEON_PW']}).encode(),
                                headers={'Content-Type': 'application/json'})
                code = u.urlopen(req, timeout=10).status
                break
            except e.HTTPError as exc:
                code = exc.code
                if code in (400, 401, 403):
                    break
            except Exception:
                pass
            time.sleep(5)
        print(code)" 2>/dev/null || echo 000)
        echo "=========================================================="
        echo " AEON dashboard admin account:"
        echo "   email:    $${ADMIN_EMAIL}"
        echo "   password: $${ADMIN_PASSWORD}"
        echo " Shown once in this build log. If the login check did not"
        echo " pass, re-run scripts/seed-admin-gcp.sh from Cloud Shell."
        echo "=========================================================="
        if [ "$$LOGIN_CODE" != "200" ]; then
          echo "::warning::admin login check returned $$LOGIN_CODE — verify manually"
        fi

  - id: report
    name: gcr.io/google.com/cloudsdktool/cloud-sdk:slim
    entrypoint: bash
    args:
      - -ceu
      - |
        echo "AEON deployed from commit ${COMMIT_SHA}"
        echo "Backend:  $$(gcloud run services describe ${_BACKEND_SERVICE} --region ${_REGION} --format='value(status.url)')"
        echo "Frontend: $$(gcloud run services describe ${_FRONTEND_SERVICE} --region ${_REGION} --format='value(status.url)')"

images:
  - ${_REGION}-docker.pkg.dev/$PROJECT_ID/${_REPOSITORY}/aeon-backend:$COMMIT_SHA
  - ${_REGION}-docker.pkg.dev/$PROJECT_ID/${_REPOSITORY}/aeon-frontend:$COMMIT_SHA

timeout: 3600s

options:
  # torch (~900 MB) + transformers install and the 60-route Next.js build
  # do not fit comfortably in the default 2-vCPU machine within 30 min.
  # E2_HIGHCPU_8 costs only for the build duration and cuts build time ~4x.
  machineType: E2_HIGHCPU_8
  # logging stays at the default (GCS + Cloud Logging): CLOUD_LOGGING_ONLY
  # would silence `gcloud builds submit` streaming, which looks like a hang.
