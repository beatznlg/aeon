# Google Cloud Build pipeline for AEON OS.
# Configure a GitHub trigger for the main branch after connecting the repository.
# Images are stored in Artifact Registry. Production deployment should promote
# only after the repository production gate and runtime verification pass.

substitutions:
  _REGION: europe-west1
  _REPOSITORY: aeon

steps:
  - id: test-backend
    name: python:3.12-slim
    entrypoint: bash
    args:
      - -ceu
      - |
        python -m pip install --upgrade pip
        if [ -f requirements.txt ]; then pip install -r requirements.txt; fi
        if [ -d tests ]; then python -m pytest -q; fi

  - id: build-backend
    name: gcr.io/cloud-builders/docker
    args:
      - build
      - -t
      - ${_REGION}-docker.pkg.dev/$PROJECT_ID/${_REPOSITORY}/aeon-backend:$COMMIT_SHA
      - .

  - id: build-frontend
    name: gcr.io/cloud-builders/docker
    args:
      - build
      - -t
      - ${_REGION}-docker.pkg.dev/$PROJECT_ID/${_REPOSITORY}/aeon-frontend:$COMMIT_SHA
      - -f
      - web/Dockerfile
      - web

  - id: push-backend
    name: gcr.io/cloud-builders/docker
    args:
      - push
      - ${_REGION}-docker.pkg.dev/$PROJECT_ID/${_REPOSITORY}/aeon-backend:$COMMIT_SHA

  - id: push-frontend
    name: gcr.io/cloud-builders/docker
    args:
      - push
      - ${_REGION}-docker.pkg.dev/$PROJECT_ID/${_REPOSITORY}/aeon-frontend:$COMMIT_SHA

images:
  - ${_REGION}-docker.pkg.dev/$PROJECT_ID/${_REPOSITORY}/aeon-backend:$COMMIT_SHA
  - ${_REGION}-docker.pkg.dev/$PROJECT_ID/${_REPOSITORY}/aeon-frontend:$COMMIT_SHA

options:
  logging: CLOUD_LOGGING_ONLY
