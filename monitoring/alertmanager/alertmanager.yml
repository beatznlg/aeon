# AEON OS Alertmanager configuration.
# Credentials and delivery endpoints are deliberately not embedded here.
# Configure SMTP at the deployment layer before enabling outbound notifications.

global:
  resolve_timeout: 5m
  smtp_smarthost: "localhost:25"
  smtp_from: "aeon-alerts@aeon.ai"
  smtp_require_tls: false

templates:
  - "/etc/alertmanager/templates/*.tmpl"

route:
  receiver: "default"
  group_by: ["alertname", "severity", "service"]
  group_wait: 30s
  group_interval: 5m
  repeat_interval: 4h
  routes:
    - receiver: "critical"
      matchers:
        - severity="critical"
      repeat_interval: 1h
    - receiver: "warning"
      matchers:
        - severity="warning"
      repeat_interval: 4h

inhibit_rules:
  - source_matchers:
      - severity="critical"
    target_matchers:
      - severity="warning"
    equal: ["alertname", "service"]

receivers:
  - name: "default"
    email_configs:
      - to: "admin@aeon.ai"
        send_resolved: true
        html: '{{ template "aeon.email" . }}'
        text: '{{ template "aeon.email.text" . }}'

  - name: "warning"
    email_configs:
      - to: "admin@aeon.ai"
        send_resolved: true
        html: '{{ template "aeon.email" . }}'
        text: '{{ template "aeon.email.text" . }}'

  - name: "critical"
    email_configs:
      - to: "admin@aeon.ai"
        send_resolved: true
        html: '{{ template "aeon.email" . }}'
        text: '{{ template "aeon.email.text" . }}'
