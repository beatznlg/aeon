# Alertmanager configuration for the AEON monitoring stack.
# Secrets are read from environment variables. Never commit real values here.
# Copy monitoring/alertmanager/alertmanager.yml as-is; set env vars in .env or
# your container orchestration secret store.

global:
  smtp_smarthost: ${ALERTMANAGER_SMTP_HOST:-localhost:25}
  smtp_from: ${ALERTMANAGER_SMTP_FROM:-alerts@example.com}
  smtp_auth_username: ${ALERTMANAGER_SMTP_USERNAME:-}
  smtp_auth_password: ${ALERTMANAGER_SMTP_PASSWORD:-}
  smtp_auth_identity: ${ALERTMANAGER_SMTP_IDENTITY:-}
  slack_api_url: ${ALERTMANAGER_SLACK_WEBHOOK_URL:-}

templates:
  - '/etc/alertmanager/templates/*.tmpl'

route:
  receiver: 'default'
  group_by: ['alertname', 'severity', 'service']
  group_wait: 10s
  group_interval: 5m
  repeat_interval: 4h
  routes:
    - matchers:
        - severity="critical"
      receiver: 'critical'
      continue: true
    - matchers:
        - severity="warning"
      receiver: 'warning'
      continue: true

receivers:
  - name: 'default'
    email_configs:
      - to: ${ALERTMANAGER_EMAIL_TO:-oncall@example.com}
        send_resolved: true
        headers:
          Subject: 'AEON Alert: {{ .GroupLabels.alertname }}'
        html: '{{ template "aeon.email" . }}'
        text: '{{ template "aeon.email.text" . }}'
    slack_configs:
      - channel: ${ALERTMANAGER_SLACK_CHANNEL:-#alerts}
        send_resolved: true
        title: '{{ template "aeon.slack.title" . }}'
        text: '{{ template "aeon.slack.text" . }}'

  - name: 'critical'
    email_configs:
      - to: ${ALERTMANAGER_EMAIL_TO:-oncall@example.com}
        send_resolved: true
        headers:
          Subject: 'CRITICAL AEON Alert: {{ .GroupLabels.alertname }}'
        html: '{{ template "aeon.email" . }}'
        text: '{{ template "aeon.email.text" . }}'
    slack_configs:
      - channel: ${ALERTMANAGER_SLACK_CHANNEL:-#alerts}
        send_resolved: true
        title: '{{ template "aeon.slack.title" . }}'
        text: '{{ template "aeon.slack.text" . }}'

  - name: 'warning'
    email_configs:
      - to: ${ALERTMANAGER_EMAIL_TO:-oncall@example.com}
        send_resolved: true
        headers:
          Subject: 'AEON Warning: {{ .GroupLabels.alertname }}'
        html: '{{ template "aeon.email" . }}'
        text: '{{ template "aeon.email.text" . }}'
    slack_configs:
      - channel: ${ALERTMANAGER_SLACK_CHANNEL:-#alerts}
        send_resolved: true
        title: '{{ template "aeon.slack.title" . }}'
        text: '{{ template "aeon.slack.text" . }}'

inhibit_rules:
  - source_matchers:
      - severity="critical"
    target_matchers:
      - severity="warning"
    equal: ['alertname', 'service']
