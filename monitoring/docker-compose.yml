# AEON OS Monitoring Stack
# One-command launch: docker compose up --build
#
# Services:
#   aeon-server   Flask AI kernel (built from project root)
#   prometheus    Metrics scraper (./prometheus/prometheus.yml)
#   alertmanager  Alert routing to email/Slack (./alertmanager/alertmanager.yml)
#   grafana       Visualization dashboard (pre-built: ./grafana/aeon-metrics.json)
#
# To stop:  docker compose down
# To reset: docker compose down -v

version: "3.8"

networks:
  aeon-mon:
    driver: bridge

volumes:
  prometheus-data:
  grafana-data:

services:
  # ── AEON Kernel ──────────────────────────────────────────────────────
  aeon-server:
    build:
      context: ..
      dockerfile: Dockerfile  # optional, assumes root has a Dockerfile or use:
    # For a quick dev build without a Dockerfile, use the python:3.11 image:
    image: python:3.11-slim
    command: >
      sh -c "
      pip install -r /app/requirements.txt --quiet --no-cache-dir &&
      python /app/aeon_server.py
      "
    volumes:
      - ..:/app
    environment:
      AEON_PYTHON_HOST: "0.0.0.0"
      AEON_PYTHON_PORT: "5000"
      AEON_ROOT: "/app/aeon_state"
      AEON_LLM_PROVIDER: "stub"
    ports:
      - "5000:5000"
    networks:
      - aeon-mon
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:5000/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 15s

  # ── Prometheus ────────────────────────────────────────────────────────
  prometheus:
    image: prom/prometheus:latest
    volumes:
      - ./prometheus:/etc/prometheus:ro
      - prometheus-data:/prometheus
    command:
      - "--config.file=/etc/prometheus/prometheus.yml"
      - "--storage.tsdb.path=/prometheus"
      - "--web.console.libraries=/usr/share/prometheus/console_libraries"
      - "--web.console.templates=/usr/share/prometheus/consoles"
      - "--web.enable-lifecycle"
    ports:
      - "9090:9090"
    networks:
      - aeon-mon
    depends_on:
      aeon-server:
        condition: service_healthy

  # ── Alertmanager ──────────────────────────────────────────────────────
  alertmanager:
    image: prom/alertmanager:latest
    volumes:
      - ./alertmanager:/etc/alertmanager:ro
    command:
      - "--config.file=/etc/alertmanager/alertmanager.yml"
      - "--storage.path=/alertmanager"
      - "--web.external-url=http://localhost:9093"
    ports:
      - "9093:9093"
    networks:
      - aeon-mon
    env_file:
      - .env  # optional: SMTP/Slack credentials
    depends_on:
      - prometheus

  # ── Grafana ───────────────────────────────────────────────────────────
  grafana:
    image: grafana/grafana:latest
    volumes:
      - grafana-data:/var/lib/grafana
      - ./grafana/aeon-metrics.json:/var/lib/grafana/dashboards/aeon-metrics.json:ro
    environment:
      - GF_SECURITY_ADMIN_USER=admin
      - GF_SECURITY_ADMIN_PASSWORD=admin
      - GF_INSTALL_PLUGINS=
      - GF_DASHBOARDS_DEFAULT_HOME_DASHBOARD_PATH=/var/lib/grafana/dashboards/aeon-metrics.json
    ports:
      - "3000:3000"
    networks:
      - aeon-mon
    depends_on:
      - prometheus
