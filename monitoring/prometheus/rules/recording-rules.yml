# AEON OS Recording Rules
# Pre-compute frequently used queries to speed up dashboard queries.

groups:
  - name: aeon_recording_rules
    interval: 30s
    rules:
      # HTTP request rate (1 min)
      - record: aeon:http_requests_rate_1m
        expr: sum(rate(aeon_http_requests_total[1m]))

      # HTTP request rate by path (1 min)
      - record: aeon:http_requests_rate_by_path_1m
        expr: sum(rate(aeon_http_requests_total[1m])) by (path)

      # HTTP request rate by status (1 min)
      - record: aeon:http_requests_rate_by_status_1m
        expr: sum(rate(aeon_http_requests_total[1m])) by (status)

      # P99 HTTP latency (5 min)
      - record: aeon:http_request_latency_p99_5m
        expr: histogram_quantile(0.99, sum(rate(aeon_http_request_duration_seconds_bucket[5m])) by (le))

      # P95 HTTP latency (5 min)
      - record: aeon:http_request_latency_p95_5m
        expr: histogram_quantile(0.95, sum(rate(aeon_http_request_duration_seconds_bucket[5m])) by (le))

      # P50 HTTP latency (5 min)
      - record: aeon:http_request_latency_p50_5m
        expr: histogram_quantile(0.50, sum(rate(aeon_http_request_duration_seconds_bucket[5m])) by (le))

      # Average HTTP request duration (5 min)
      - record: aeon:http_request_duration_avg_5m
        expr: |
          sum(rate(aeon_http_request_duration_seconds_sum[5m]))
          /
          sum(rate(aeon_http_request_duration_seconds_count[5m]))

      # Agent tick rate (1 min)
      - record: aeon:agent_tick_rate_1m
        expr: sum(rate(aeon_agent_ticks_total[1m]))

      # Agent tick rate by app (1 min)
      - record: aeon:agent_tick_rate_by_app_1m
        expr: sum(rate(aeon_agent_ticks_total[1m])) by (app_id)

      # Chat request rate (1 min)
      - record: aeon:chat_requests_rate_1m
        expr: sum(rate(aeon_chat_requests_total[1m]))

      # App chat request rate (1 min)
      - record: aeon:app_chat_requests_rate_1m
        expr: sum(rate(aeon_app_chat_requests_total[1m])) by (app_id)

      # Workflow run rate (1 min)
      - record: aeon:workflow_runs_rate_1m
        expr: sum(rate(aeon_workflow_runs_total[1m]))

      # Integration run rate (1 min)
      - record: aeon:integration_runs_rate_1m
        expr: sum(rate(aeon_integration_runs_total[1m]))

      # Error ratio (5 min)
      - record: aeon:error_ratio_5m
        expr: |
          sum(rate(aeon_http_requests_total{status=~"5.."}[5m]))
          /
          sum(rate(aeon_http_requests_total[5m]))

      # Agents loaded (current)
      - record: aeon:agents_loaded
        expr: aeon_agents_loaded

      # Job queue size (current)
      - record: aeon:job_queue_size
        expr: aeon_job_queue_size
