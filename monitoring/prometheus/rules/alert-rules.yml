# AEON OS Alert Rules
# Fires alerts when key metrics exceed defined thresholds.

groups:
  - name: aeon_alerts
    interval: 15s
    rules:
      # ── High Error Rate ──────────────────────────────────────────────
      - alert: AeonHighErrorRate
        expr: |
          (sum(rate(aeon_http_requests_total{status=~"5.."}[5m]))
           /
           sum(rate(aeon_http_requests_total[5m])))
          > 0.05
        for: 2m
        labels:
          severity: critical
          service: aeon-kernel
        annotations:
          summary: "AEON kernel error rate above 5%"
          description: "HTTP 5xx rate is {{ $value | humanizePercentage }} for 2 minutes."
          runbook: "https://github.com/beatznlg/aeon/blob/main/monitoring/README.md#aeonhigherrorrate"

      # ── High Latency ─────────────────────────────────────────────────
      - alert: AeonHighLatency
        expr: |
          histogram_quantile(0.99,
            sum(rate(aeon_http_request_duration_seconds_bucket[5m])) by (le, method, path)
          ) > 1.0
        for: 3m
        labels:
          severity: warning
          service: aeon-kernel
        annotations:
          summary: "AEON kernel P99 latency above 1s"
          description: "P99 request latency on {{ $labels.method }} {{ $labels.path }} is {{ $value | humanizeDuration }}."
          runbook: "https://github.com/beatznlg/aeon/blob/main/monitoring/README.md#aeonhighlatency"

      # ── Job Queue Depth ──────────────────────────────────────────────
      - alert: AeonJobQueueDeep
        expr: aeon_job_queue_size > 50
        for: 5m
        labels:
          severity: warning
          service: aeon-kernel
        annotations:
          summary: "AEON async job queue is deep"
          description: "Job queue has {{ $value }} pending jobs for 5 minutes."
          runbook: "https://github.com/beatznlg/aeon/blob/main/monitoring/README.md#aeonjobqueuedeep"

      # ── Agent Tick Errors ────────────────────────────────────────────
      - alert: AeonAgentTickErrors
        expr: |
          sum(rate(aeon_http_requests_total{status=~"5..", path=~"/apps/.*/tick"}[5m]))
          > 0.1
        for: 2m
        labels:
          severity: critical
          service: aeon-kernel
        annotations:
          summary: "AEON agent tick errors exceeding threshold"
          description: "Agent tick error rate is {{ $value }} per second."
          runbook: "https://github.com/beatznlg/aeon/blob/main/monitoring/README.md#aeonagenttickerrors"

      # ── Kernel Down ──────────────────────────────────────────────────
      - alert: AeonKernelDown
        expr: up{job="aeon-kernel"} == 0
        for: 1m
        labels:
          severity: critical
          service: aeon-kernel
        annotations:
          summary: "AEON kernel is unreachable"
          description: "Prometheus cannot scrape the AEON kernel at {{ $labels.instance }}."

      # ── Workflow Run Failures ────────────────────────────────────────
      - alert: AeonWorkflowFailures
        expr: |
          sum(rate(aeon_workflow_runs_total{ok="false"}[10m]))
          > 0.5
        for: 3m
        labels:
          severity: warning
          service: aeon-kernel
        annotations:
          summary: "Workflow run failures elevated"
          description: "Workflow failure rate is {{ $value }} per second over 10 minutes."

      # ── Webhook Delivery Failures ─────────────────────────────────────
      - alert: AeonWebhookFailures
        expr: |
          sum(rate(aeon_webhook_deliveries_total{verified="false"}[10m]))
          > 1
        for: 5m
        labels:
          severity: warning
          service: aeon-kernel
        annotations:
          summary: "Webhook delivery failures elevated"
          description: "Unverified webhook delivery rate is {{ $value }} per second."
