# AEON OS Prometheus Configuration
# Scrapes the AEON kernel metrics endpoint and forwards alerts to Alertmanager.

global:
  scrape_interval:     15s
  evaluation_interval: 15s
  external_labels:
    monitor: "aeon-os"

# Alertmanager configuration
alerting:
  alertmanagers:
    - static_configs:
        - targets:
          - alertmanager:9093

# Rule files
rule_files:
  - "rules/alert-rules.yml"
  - "rules/recording-rules.yml"

# Scrape configurations
scrape_configs:
  # AEON kernel self-scrape
  - job_name: "aeon-kernel"
    metrics_path: "/metrics"
    scrape_interval: 10s
    static_configs:
      - targets:
          - "aeon-server:5000"
        labels:
          service: "aeon-kernel"
          tier: "core"

  # Prometheus self-scrape
  - job_name: "prometheus"
    static_configs:
      - targets:
          - "localhost:9090"
