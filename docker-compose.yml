# AEON OS — Self-Hosted Stack
# ============================
# One-command launch of the full AEON platform:
#   Postgres (database) + Flask (AI kernel) + Next.js (web dashboard)
#
# Quick start:
#   1. Copy .env.example to .env and fill in your values
#   2. docker compose up --build
#   3. Open http://localhost:3000
#
# To include monitoring (Prometheus + Grafana + Alertmanager):
#   docker compose --profile monitoring up --build
#
# To stop:   docker compose down
# To reset:  docker compose down -v

version: "3.8"

name: aeon-os

# ─── Networks ─────────────────────────────────────────────────────────────
networks:
  aeon-net:
    driver: bridge

# ─── Volumes ───────────────────────────────────────────────────────────────
volumes:
  postgres-data:
  aeon-state:

# ─── Services ──────────────────────────────────────────────────────────────
services:

  # ── Postgres Database ──────────────────────────────────────────────────
  postgres:
    image: postgres:16-alpine
    container_name: aeon-postgres
    restart: unless-stopped
    ports:
      - "5432:5432"
    environment:
      POSTGRES_USER: &db_user   aeon
      POSTGRES_PASSWORD: &db_pass   ${AEON_DB_PASSWORD:-aeon_dev_pass}
      POSTGRES_DB: &db_name    aeon
    volumes:
      - postgres-data:/var/lib/postgresql/data
      - ./scripts/init-db.sql:/docker-entrypoint-initdb.d/01-init-db.sql:ro
    networks:
      - aeon-net
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U aeon"]
      interval: 5s
      timeout: 5s
      retries: 5
      start_period: 10s

  # ── Flask AI Kernel ────────────────────────────────────────────────────
  backend:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: aeon-backend
    restart: unless-stopped
    ports:
      - "${AEON_PYTHON_PORT:-5000}:5000"
    environment:
      AEON_PYTHON_HOST: "0.0.0.0"
      AEON_PYTHON_PORT: "5000"
      AEON_ROOT: "/app/state"
      AEON_LLM_PROVIDER: "${AEON_LLM_PROVIDER:-stub}"
      AEON_LOG_LEVEL: "${AEON_LOG_LEVEL:-INFO}"
      AEON_DATABASE_URL: "postgresql://aeon:${AEON_DB_PASSWORD:-aeon_dev_pass}@postgres:5432/aeon"
      # LLM provider keys (optional — set in .env)
      OPENAI_API_KEY: "${OPENAI_API_KEY:-}"
      ANTHROPIC_API_KEY: "${ANTHROPIC_API_KEY:-}"
      HUGGINGFACE_TOKEN: "${HUGGINGFACE_TOKEN:-}"
      # Stripe keys (optional)
      STRIPE_API_KEY: "${STRIPE_API_KEY:-}"
      STRIPE_WEBHOOK_SECRET: "${STRIPE_WEBHOOK_SECRET:-}"
      STRIPE_PRICE_TEAM: "${STRIPE_PRICE_TEAM:-}"
      STRIPE_PRICE_ENTERPRISE: "${STRIPE_PRICE_ENTERPRISE:-}"
    volumes:
      - aeon-state:/app/state
    networks:
      - aeon-net
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:5000/health"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 20s

  # ── Next.js Web Dashboard ──────────────────────────────────────────────
  frontend:
    build:
      context: ./web
      dockerfile: Dockerfile
    container_name: aeon-frontend
    restart: unless-stopped
    ports:
      - "${AEON_FRONTEND_PORT:-3000}:3000"
    environment:
      NODE_ENV: production
      PORT: 3000
      AEON_PYTHON_URL: "http://backend:5000"
      NEXTAUTH_URL: "${NEXTAUTH_URL:-http://localhost:3000}"
      NEXTAUTH_SECRET: "${NEXTAUTH_SECRET:-}"
      # Optional Supabase
      NEXT_PUBLIC_SUPABASE_URL: "${SUPABASE_URL:-}"
      NEXT_PUBLIC_SUPABASE_ANON_KEY: "${SUPABASE_ANON_KEY:-}"
      SUPABASE_SERVICE_ROLE_KEY: "${SUPABASE_SERVICE_ROLE_KEY:-}"
    networks:
      - aeon-net
    depends_on:
      backend:
        condition: service_healthy

  # ── Optional: Nginx Reverse Proxy ──────────────────────────────────────
  # Uncomment to expose everything through a single port with routing
  # nginx:
  #   image: nginx:alpine
  #   container_name: aeon-nginx
  #   ports:
  #     - "80:80"
  #   volumes:
  #     - ./scripts/nginx.conf:/etc/nginx/conf.d/default.conf:ro
  #   networks:
  #     - aeon-net
  #   depends_on:
  #     - frontend
  #     - backend

# ─── Optional: Monitoring Stack ───────────────────────────────────────────
# Launch with:  docker compose --profile monitoring up --build
#
# Includes: Prometheus (scraper), Grafana (dashboards), Alertmanager (alerts)
# Pre-configured dashboards and alert rules live in ./monitoring/

# Services are defined in monitoring/docker-compose.yml
# They can be launched alongside this stack by using:
#   docker compose -f docker-compose.yml -f monitoring/docker-compose.yml up --build
