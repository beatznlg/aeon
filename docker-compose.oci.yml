# AEON OS — full stack on a single Oracle Cloud VM
# Frontend (Next.js) + Kernel (Flask) + Postgres + Redis + workers + Caddy TLS.
# Deploy: see DEPLOY_ORACLE.md | Run: docker compose -f docker-compose.oci.yml up -d --build

name: aeon-os

networks:
  aeon-net:
    driver: bridge

services:
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: aeon
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in .env}
      POSTGRES_DB: aeon
    volumes:
      - pgdata:/var/lib/postgresql/data
    networks:
      - aeon-net
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U aeon -d aeon"]
      interval: 10s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    command: ["redis-server", "--appendonly", "yes"]
    volumes:
      - redisdata:/data
    networks:
      - aeon-net
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  backend:
    build: .
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    environment:
      AEON_ENV: production
      AEON_DATABASE_URL: postgresql://aeon:${POSTGRES_PASSWORD}@postgres:5432/aeon
      AEON_REDIS_URL: redis://redis:6379/0
      AEON_CELERY_RESULT_BACKEND: redis://redis:6379/1
      AEON_JWT_SECRET: ${AEON_JWT_SECRET:?set AEON_JWT_SECRET in .env}
      AEON_API_TOKEN: ${AEON_API_TOKEN:-}
      AEON_MASTER_KMS_KEY: ${AEON_MASTER_KMS_KEY:?set AEON_MASTER_KMS_KEY in .env}
      AEON_ADMIN_EMAIL: ${AEON_ADMIN_EMAIL:-}
      AEON_ADMIN_NAME: ${AEON_ADMIN_NAME:-Admin}
      AEON_ADMIN_PASSWORD: ${AEON_ADMIN_PASSWORD:-}
      AEON_LLM_PROVIDER: ${AEON_LLM_PROVIDER:-stub}
      OPENAI_API_KEY: ${OPENAI_API_KEY:-}
      ANTHROPIC_API_KEY: ${ANTHROPIC_API_KEY:-}
      GOOGLE_API_KEY: ${GOOGLE_API_KEY:-}
      MISTRAL_API_KEY: ${MISTRAL_API_KEY:-}
      OPENROUTER_API_KEY: ${OPENROUTER_API_KEY:-}
      HUGGINGFACE_TOKEN: ${HUGGINGFACE_TOKEN:-}
      AEON_CORS_ALLOWED_ORIGINS: ${AEON_CORS_ALLOWED_ORIGINS:-http://localhost}
      STRIPE_API_KEY: ${STRIPE_API_KEY:-}
      STRIPE_WEBHOOK_SECRET: ${STRIPE_WEBHOOK_SECRET:-}
      STRIPE_PRICE_TEAM: ${STRIPE_PRICE_TEAM:-}
      STRIPE_PRICE_ENTERPRISE: ${STRIPE_PRICE_ENTERPRISE:-}
    volumes:
      - backend_state:/app/state
    networks:
      - aeon-net

  worker:
    build: .
    restart: unless-stopped
    command: ["celery", "-A", "aeon_worker", "worker", "--loglevel=info", "--concurrency=2"]
    depends_on:
      backend:
        condition: service_started
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    environment:
      AEON_ENV: production
      AEON_DATABASE_URL: postgresql://aeon:${POSTGRES_PASSWORD}@postgres:5432/aeon
      AEON_REDIS_URL: redis://redis:6379/0
      AEON_CELERY_RESULT_BACKEND: redis://redis:6379/1
      AEON_JWT_SECRET: ${AEON_JWT_SECRET:?set AEON_JWT_SECRET in .env}
      AEON_MASTER_KMS_KEY: ${AEON_MASTER_KMS_KEY:?set AEON_MASTER_KMS_KEY in .env}
      AEON_LLM_PROVIDER: ${AEON_LLM_PROVIDER:-stub}
      OPENAI_API_KEY: ${OPENAI_API_KEY:-}
      ANTHROPIC_API_KEY: ${ANTHROPIC_API_KEY:-}
      GOOGLE_API_KEY: ${GOOGLE_API_KEY:-}
      MISTRAL_API_KEY: ${MISTRAL_API_KEY:-}
      OPENROUTER_API_KEY: ${OPENROUTER_API_KEY:-}
      HUGGINGFACE_TOKEN: ${HUGGINGFACE_TOKEN:-}
    volumes:
      - backend_state:/app/state
    networks:
      - aeon-net

  beat:
    build: .
    restart: unless-stopped
    command: ["celery", "-A", "aeon_worker", "beat", "--loglevel=info"]
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    environment:
      AEON_ENV: production
      AEON_DATABASE_URL: postgresql://aeon:${POSTGRES_PASSWORD}@postgres:5432/aeon
      AEON_REDIS_URL: redis://redis:6379/0
      AEON_CELERY_RESULT_BACKEND: redis://redis:6379/1
      AEON_JWT_SECRET: ${AEON_JWT_SECRET:?set AEON_JWT_SECRET in .env}
      AEON_MASTER_KMS_KEY: ${AEON_MASTER_KMS_KEY:?set AEON_MASTER_KMS_KEY in .env}
      AEON_LLM_PROVIDER: ${AEON_LLM_PROVIDER:-stub}
    volumes:
      - backend_state:/app/state
    networks:
      - aeon-net

  web:
    build: ./web
    restart: unless-stopped
    depends_on:
      backend:
        condition: service_started
    environment:
      AUTH_SECRET: ${AUTH_SECRET:?set AUTH_SECRET in .env}
      AEON_API_TOKEN: ${AEON_API_TOKEN:-}
      ADMIN_EMAIL: ${AEON_ADMIN_EMAIL:-}
      ADMIN_PASSWORD: ${AEON_ADMIN_PASSWORD:-}
      NEXTAUTH_URL: ${NEXTAUTH_URL:-}
      AUTH_TRUST_HOST: "true"
      AEON_PYTHON_URL: http://backend:5000
      NEXT_PUBLIC_APP_NAME: ${NEXT_PUBLIC_APP_NAME:-AEON OS}
      NEXT_PUBLIC_APP_URL: ${NEXT_PUBLIC_APP_URL:-}
    volumes:
      - web_data:/app/.data
    networks:
      - aeon-net

  caddy:
    image: caddy:2-alpine
    restart: unless-stopped
    depends_on:
      - web
      - backend
    ports:
      - "80:80"
      - "443:443"
    environment:
      AEON_DOMAIN: ${AEON_DOMAIN:-:80}
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    networks:
      - aeon-net

volumes:
  pgdata:
  redisdata:
  backend_state:
  web_data:
  caddy_data:
  caddy_config:
