# AEON OS — full stack on a single Oracle Cloud VM
# Frontend (Next.js) + Kernel (Flask) + Postgres + Caddy TLS proxy.
# Deploy: see DEPLOY_ORACLE.md  |  Run: docker compose up -d --build

name: aeon-os

services:
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: aeon
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in .env}
      POSTGRES_DB: aeon
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U aeon -d aeon"]
      interval: 10s
      timeout: 5s
      retries: 5

  backend:
    build: .
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      AEON_ENV: production
      AEON_DATABASE_URL: postgresql://aeon:${POSTGRES_PASSWORD}@postgres:5432/aeon
      AEON_JWT_SECRET: ${AEON_JWT_SECRET:?set AEON_JWT_SECRET in .env}
      AEON_MASTER_KMS_KEY: ${AEON_MASTER_KMS_KEY:-}
      AEON_ADMIN_EMAIL: ${AEON_ADMIN_EMAIL:-}
      AEON_ADMIN_NAME: ${AEON_ADMIN_NAME:-Admin}
      # Only set on first boot; ignored once the admin user exists.
      AEON_ADMIN_PASSWORD: ${AEON_ADMIN_PASSWORD:-}
      AEON_LLM_PROVIDER: ${AEON_LLM_PROVIDER:-stub}
      OPENAI_API_KEY: ${OPENAI_API_KEY:-}
      ANTHROPIC_API_KEY: ${ANTHROPIC_API_KEY:-}
      # Repair script writes the real origin (http://<vm-ip>) into .env.
      AEON_CORS_ALLOWED_ORIGINS: ${AEON_CORS_ALLOWED_ORIGINS:-http://localhost}
      SUPABASE_URL: ${SUPABASE_URL:-}
      SUPABASE_SERVICE_ROLE_KEY: ${SUPABASE_SERVICE_ROLE_KEY:-}
    volumes:
      - backend_state:/app/state

  web:
    build: ./web
    restart: unless-stopped
    depends_on:
      - backend
    environment:
      AUTH_SECRET: ${AUTH_SECRET:?set AUTH_SECRET in .env}
      # Set correctly by scripts/aeon-env-repair.sh (http://<vm-ip>).
      NEXTAUTH_URL: ${NEXTAUTH_URL:-http://localhost}
      AUTH_TRUST_HOST: "true"
      # Same-VM kernel over the compose network.
      AEON_PYTHON_URL: http://backend:5000
      NEXT_PUBLIC_SUPABASE_URL: ${NEXT_PUBLIC_SUPABASE_URL:-}
      NEXT_PUBLIC_SUPABASE_ANON_KEY: ${NEXT_PUBLIC_SUPABASE_ANON_KEY:-}
    volumes:
      # Persist the offline-registration store: users who sign up while the
      # backend is down must still exist after the next rebuild/restart.
      - web_data:/app/.data

  caddy:
    image: caddy:2-alpine
    restart: unless-stopped
    depends_on:
      - web
      - backend
    ports:
      - "80:80"
      - "443:443"
    environment:
      # Default to :80 (plain HTTP) until AEON_DOMAIN is set. An empty
      # AEON_DOMAIN would leave the Caddyfile site address as {:80}, which
      # Caddy mis-parses as global options.
      AEON_DOMAIN: ${AEON_DOMAIN:-:80}
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config

volumes:
  pgdata:
  backend_state:
  web_data:
  caddy_data:
  caddy_config:
