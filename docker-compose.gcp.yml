# AEON OS — Google Cloud Compute Engine production stack
# Designed for a single Compute Engine VM first, with a clean path to managed GCP services later.
# Only Caddy is public; PostgreSQL, Redis, API, workers and frontend stay private.
name: aeon-os

networks:
  aeon-net:
    driver: bridge

services:
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: aeon
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in .env}
      POSTGRES_DB: aeon
    volumes:
      - pgdata:/var/lib/postgresql/data
    networks: [aeon-net]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U aeon -d aeon"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    command: ["redis-server", "--appendonly", "yes", "--save", "900", "1", "--save", "300", "10"]
    volumes:
      - redisdata:/data
    networks: [aeon-net]
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  backend:
    build: .
    restart: unless-stopped
    init: true
    stop_grace_period: 30s
    depends_on:
      postgres: {condition: service_healthy}
      redis: {condition: service_healthy}
    environment:
      AEON_ENV: production
      AEON_DATABASE_URL: postgresql://aeon:${POSTGRES_PASSWORD}@postgres:5432/aeon
      AEON_REDIS_URL: redis://redis:6379/0
      AEON_CELERY_RESULT_BACKEND: redis://redis:6379/1
      AEON_JWT_SECRET: ${AEON_JWT_SECRET:?set AEON_JWT_SECRET in .env}
      AEON_MASTER_KMS_KEY: ${AEON_MASTER_KMS_KEY:?set AEON_MASTER_KMS_KEY in .env}
      AEON_API_TOKEN: ${AEON_API_TOKEN:-}
      AEON_ADMIN_EMAIL: ${AEON_ADMIN_EMAIL:-}
      AEON_ADMIN_NAME: ${AEON_ADMIN_NAME:-Admin}
      AEON_ADMIN_PASSWORD: ${AEON_ADMIN_PASSWORD:-}
      AEON_LLM_PROVIDER: ${AEON_LLM_PROVIDER:-stub}
      OPENAI_API_KEY: ${OPENAI_API_KEY:-}
      ANTHROPIC_API_KEY: ${ANTHROPIC_API_KEY:-}
      GOOGLE_API_KEY: ${GOOGLE_API_KEY:-}
      MISTRAL_API_KEY: ${MISTRAL_API_KEY:-}
      OPENROUTER_API_KEY: ${OPENROUTER_API_KEY:-}
      HUGGINGFACE_TOKEN: ${HUGGINGFACE_TOKEN:-}
      AEON_CORS_ALLOWED_ORIGINS: ${AEON_CORS_ALLOWED_ORIGINS:?set AEON_CORS_ALLOWED_ORIGINS in .env}
      STRIPE_API_KEY: ${STRIPE_API_KEY:-}
      STRIPE_WEBHOOK_SECRET: ${STRIPE_WEBHOOK_SECRET:-}
      STRIPE_PRICE_TEAM: ${STRIPE_PRICE_TEAM:-}
      STRIPE_PRICE_ENTERPRISE: ${STRIPE_PRICE_ENTERPRISE:-}
      AEON_STORAGE_BACKEND: ${AEON_STORAGE_BACKEND:-local}
      AWS_S3_BUCKET: ${AWS_S3_BUCKET:-}
      AWS_REGION: ${AWS_REGION:-}
      GCP_PROJECT_ID: ${GCP_PROJECT_ID:-}
      GCS_BUCKET: ${GCS_BUCKET:-}
    volumes:
      - backend_state:/app/state
    networks: [aeon-net]
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://localhost:5000/health"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 30s

  worker:
    build: .
    restart: unless-stopped
    init: true
    stop_grace_period: 60s
    command: ["celery", "-A", "aeon_worker", "worker", "--loglevel=info", "--concurrency=2"]
    depends_on:
      backend: {condition: service_healthy}
      postgres: {condition: service_healthy}
      redis: {condition: service_healthy}
    environment:
      AEON_ENV: production
      AEON_DATABASE_URL: postgresql://aeon:${POSTGRES_PASSWORD}@postgres:5432/aeon
      AEON_REDIS_URL: redis://redis:6379/0
      AEON_CELERY_RESULT_BACKEND: redis://redis:6379/1
      AEON_JWT_SECRET: ${AEON_JWT_SECRET:?set AEON_JWT_SECRET in .env}
      AEON_MASTER_KMS_KEY: ${AEON_MASTER_KMS_KEY:?set AEON_MASTER_KMS_KEY in .env}
      AEON_LLM_PROVIDER: ${AEON_LLM_PROVIDER:-stub}
      OPENAI_API_KEY: ${OPENAI_API_KEY:-}
      ANTHROPIC_API_KEY: ${ANTHROPIC_API_KEY:-}
      GOOGLE_API_KEY: ${GOOGLE_API_KEY:-}
      MISTRAL_API_KEY: ${MISTRAL_API_KEY:-}
      OPENROUTER_API_KEY: ${OPENROUTER_API_KEY:-}
      HUGGINGFACE_TOKEN: ${HUGGINGFACE_TOKEN:-}
    volumes:
      - backend_state:/app/state
    networks: [aeon-net]

  beat:
    build: .
    restart: unless-stopped
    init: true
    command: ["celery", "-A", "aeon_worker", "beat", "--loglevel=info"]
    depends_on:
      postgres: {condition: service_healthy}
      redis: {condition: service_healthy}
    environment:
      AEON_ENV: production
      AEON_DATABASE_URL: postgresql://aeon:${POSTGRES_PASSWORD}@postgres:5432/aeon
      AEON_REDIS_URL: redis://redis:6379/0
      AEON_CELERY_RESULT_BACKEND: redis://redis:6379/1
      AEON_JWT_SECRET: ${AEON_JWT_SECRET:?set AEON_JWT_SECRET in .env}
      AEON_MASTER_KMS_KEY: ${AEON_MASTER_KMS_KEY:?set AEON_MASTER_KMS_KEY in .env}
      AEON_LLM_PROVIDER: ${AEON_LLM_PROVIDER:-stub}
    volumes:
      - backend_state:/app/state
    networks: [aeon-net]

  web:
    build: ./web
    restart: unless-stopped
    init: true
    depends_on:
      backend: {condition: service_healthy}
    environment:
      NODE_ENV: production
      AUTH_SECRET: ${AUTH_SECRET:?set AUTH_SECRET in .env}
      AEON_API_TOKEN: ${AEON_API_TOKEN:-}
      ADMIN_EMAIL: ${AEON_ADMIN_EMAIL:-}
      ADMIN_PASSWORD: ${AEON_ADMIN_PASSWORD:-}
      NEXTAUTH_URL: ${NEXTAUTH_URL:?set NEXTAUTH_URL in .env}
      AUTH_TRUST_HOST: "true"
      AEON_PYTHON_URL: http://backend:5000
      NEXT_PUBLIC_APP_NAME: ${NEXT_PUBLIC_APP_NAME:-AEON OS}
      NEXT_PUBLIC_APP_URL: ${NEXT_PUBLIC_APP_URL:?set NEXT_PUBLIC_APP_URL in .env}
    volumes:
      - web_data:/app/.data
    networks: [aeon-net]

  caddy:
    image: caddy:2-alpine
    restart: unless-stopped
    depends_on: [web, backend]
    ports:
      - "80:80"
      - "443:443"
    environment:
      AEON_DOMAIN: ${AEON_DOMAIN:?set AEON_DOMAIN in .env}
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    networks: [aeon-net]

volumes:
  pgdata:
  redisdata:
  backend_state:
  web_data:
  caddy_data:
  caddy_config:
